<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto MusicBrainz</title>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/objects.js"></script>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <script src="assets/js/theme.js"></script>
  </head>
  <body>
    <div class="container app-container mx-auto">
      <div class="d-flex gap-2 mb-4">
        <form id="searchForm" class="input-group flex-grow-1">
          <button
            type="submit"
            class="input-group-text bg-transparent border-end-0"
          >
            <i class="bi bi-search text-secondary"></i>
          </button>
          <input
            id="searchInput"
            type="text"
            class="form-control border-start-0"
            placeholder="Search..."
          />
        </form>

        <select class="form-select w-auto">
          <option selected>Artists</option>
          <option value="1">Songs</option>
        </select>
      </div>

      <div id="result-container" class="d-flex flex-column gap-2"></div>
    </div>
  </body>
</html>
